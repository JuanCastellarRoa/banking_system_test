<form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <h3 class="form__title">{{ isEditing ? 'Editar Cuenta' : 'Nueva Cuenta' }}</h3>

  <div class="form__grid">

    <!-- Número de Cuenta -->
    <div class="form__group" *ngIf="!isEditing">
      <label class="form__label">Número de Cuenta *</label>
      <input
        class="form__control"
        [class.form__control--invalid]="f['numeroCuenta'].invalid && f['numeroCuenta'].touched"
        formControlName="numeroCuenta"
        type="number"
        placeholder="Ej: 478758"
      />
      <span class="form__error" *ngIf="f['numeroCuenta'].touched && f['numeroCuenta'].errors?.['required']">
        El número de cuenta es obligatorio.
      </span>
      <span class="form__error" *ngIf="f['numeroCuenta'].touched && f['numeroCuenta'].errors?.['min']">
        Debe ser un número positivo.
      </span>
    </div>

    <!-- Tipo de cuenta -->
    <div class="form__group">
      <label class="form__label">Tipo de Cuenta *</label>
      <select
        class="form__control"
        [class.form__control--invalid]="f['tipoCuenta'].invalid && f['tipoCuenta'].touched"
        formControlName="tipoCuenta"
      >
        <option value="">-- Seleccionar --</option>
        <option value="AHORRO">Ahorro</option>
        <option value="CORRIENTE">Corriente</option>
      </select>
      <span class="form__error" *ngIf="f['tipoCuenta'].touched && f['tipoCuenta'].errors?.['required']">
        El tipo de cuenta es obligatorio.
      </span>
    </div>

    <!-- Saldo inicial -->
    <div class="form__group">
      <label class="form__label">Saldo Inicial *</label>
      <input
        class="form__control"
        [class.form__control--invalid]="f['saldoInicial'].invalid && f['saldoInicial'].touched"
        formControlName="saldoInicial"
        type="number"
        step="0.01"
        placeholder="0.00"
      />
      <span class="form__error" *ngIf="f['saldoInicial'].touched && f['saldoInicial'].errors?.['required']">
        El saldo inicial es obligatorio.
      </span>
      <span class="form__error" *ngIf="f['saldoInicial'].touched && f['saldoInicial'].errors?.['min']">
        El saldo no puede ser negativo.
      </span>
    </div>

    <!-- Estado -->
    <div class="form__group">
      <label class="form__label">Estado *</label>
      <select class="form__control" formControlName="estado">
        <option [ngValue]="true">Activa</option>
        <option [ngValue]="false">Inactiva</option>
      </select>
    </div>

    <!-- Cliente -->
    <div class="form__group form__group--span2">
      <label class="form__label">Cliente *</label>
      <select
        class="form__control"
        [class.form__control--invalid]="f['clienteId'].invalid && f['clienteId'].touched"
        formControlName="clienteId"
      >
        <option value="">-- Seleccionar cliente --</option>
        <option *ngFor="let c of clientes" [ngValue]="c.clienteId">{{ c.nombre }}</option>
      </select>
      <span class="form__error" *ngIf="f['clienteId'].touched && f['clienteId'].errors?.['required']">
        Debe seleccionar un cliente.
      </span>
    </div>

  </div>

  <div class="form__actions">
    <button type="button" class="btn btn--secondary" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn btn--primary" [disabled]="submitting">
      {{ submitting ? 'Guardando...' : (isEditing ? 'Actualizar' : 'Crear') }}
    </button>
  </div>
</form>
